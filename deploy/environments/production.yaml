# 生产环境公网配置（唯一域名来源）
# 改 public.host 后执行: ./start.sh restart-prod  或  ./scripts/restart-backend-prod.sh
# 启动时会自动 render 并加载，无需手跑 npm run render:deploy

name: production
description: 生产 / 公网部署

public:
  host: uat-guanpei.eminxing.com
  scheme: https

paths:
  # 与 server.servlet.context-path 一致
  api_context: /attendance/api
  # 相对 api_context 的路径段
  feishu_oauth_callback: /feishu-auth/callback
  # PC 前端 Vite base（与 frontend/vite.config.js base 一致）
  frontend_web_base: /attendance
  # 相对 frontend_web_base 的路由（Vue Router /feishu/callback）
  frontend_feishu_callback: feishu/callback
  frontend_login: ""

spring:
  profile: prod
