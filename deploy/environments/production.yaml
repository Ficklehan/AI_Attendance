# ★ 站点唯一运维配置（域名 + 本地/公网环境）
# 改完后执行: ./start.sh apply  或  npm run apply:site
# 会自动 render 各端配置并按 runtime.mode 重启后端

name: production
description: 生产 / 公网部署

# 环境模式：local = 本机开发 | public = 公网/手机飞书
# 注意：生产服务器上请保持 mode: public（可与本地仓库提交值不同，部署前确认）
runtime:
  mode: local
  local_api_base: http://localhost:8080/attendance/api

public:
  host: uat-guanpei.eminxing.com
  scheme: https

paths:
  # 与 server.servlet.context-path 一致
  api_context: /attendance/api
  # 相对 api_context 的路径段
  feishu_oauth_callback: /feishu-auth/callback
  # PC 前端 Vite base（与 frontend/vite.config.js base 一致）
  frontend_web_base: /attendance
  # 相对 frontend_web_base 的路由（Vue Router /feishu/callback）
  frontend_feishu_callback: feishu/callback
  frontend_login: ""

spring:
  profile: prod
