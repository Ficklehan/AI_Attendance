<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>小程序 - 识别中</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang SC", sans-serif; background: #F8FAFC; width: 390px; margin: 0 auto; min-height: 844px; }
    .nav { height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 600; background: #fff; }
    .hero { height: 180px; background: url('../../../feishu-miniprogram/assets/attendance-processing-bg.png') center/cover; position: relative; }
    .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.1), #F8FAFC); }
    .card { margin: -40px 16px 0; background: #fff; border-radius: 16px; padding: 24px 20px; box-shadow: 0 8px 24px rgba(28,26,46,.08); position: relative; z-index: 1; }
    .steps { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 24px; font-size: 11px; }
    .dot { width: 22px; height: 22px; border-radius: 50%; background: #EFF6FF; color: #2563EB; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; }
    .dot.done { background: #2563EB; color: #fff; }
    .dot.active { box-shadow: 0 0 0 4px rgba(37,99,235,.2); }
    .line { width: 28px; height: 2px; background: #EDEAEF; }
    .line.done { background: #2563EB; }
    .ring { width: 64px; height: 64px; border: 4px solid #EFF6FF; border-top-color: #2563EB; border-radius: 50%; margin: 0 auto 16px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { text-align: center; font-size: 17px; font-weight: 600; margin-bottom: 8px; }
    .meta { text-align: center; font-size: 12px; color: #73707F; margin-bottom: 12px; }
    .tags { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .tag { font-size: 11px; padding: 4px 10px; border-radius: 999px; background: #EFF6FF; color: #2563EB; }
    .progress { text-align: center; margin-bottom: 8px; }
    .count { font-size: 32px; font-weight: 700; color: #2563EB; }
    .hint { text-align: center; font-size: 12px; color: #73707F; line-height: 1.6; margin-top: 12px; }
    .dock { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 390px; padding: 12px 16px 28px; display: flex; gap: 10px; }
    .btn { flex: 1; text-align: center; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 14px; }
    .btn-sec { background: #fff; border: 1px solid #EDEAEF; }
    .btn-pri { background: linear-gradient(135deg, #2563EB, #3B82F6); color: #fff; }
  </style>
</head>
<body>
  <div class="nav">识别处理中</div>
  <div class="hero"></div>
  <div class="card">
    <div class="steps">
      <div><div class="dot done">1</div><div style="text-align:center;margin-top:4px">上传</div></div>
      <div class="line done"></div>
      <div><div class="dot done active">2</div><div style="text-align:center;margin-top:4px">分析</div></div>
      <div class="line"></div>
      <div><div class="dot">3</div><div style="text-align:center;margin-top:4px">完成</div></div>
    </div>
    <div class="ring"></div>
    <div class="title">已识别 18 条，后台继续处理…</div>
    <div class="meta">法国 FR · 已等待 42 秒</div>
    <div class="tags"><span class="tag">法国 FR</span><span class="tag" style="background:#F8FAFC;color:#73707F">MiMo Vision</span></div>
    <div class="progress"><span class="count">18</span><div style="font-size:12px;color:#73707F">条已解析</div></div>
    <div class="hint">大表首张结果约 1～2 分钟，识别中会显示已解析条数<br/>可返回首页或查看任务，识别将在后台继续</div>
  </div>
  <div class="dock">
    <div class="btn btn-sec">返回首页</div>
    <div class="btn btn-pri">查看任务</div>
  </div>
</body>
</html>
