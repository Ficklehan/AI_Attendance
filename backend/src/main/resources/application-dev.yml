spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:attendance_assistant}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:28800000}

feishu:
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}

logging:
  level:
    com.attendance: DEBUG
    com.attendance.mapper: INFO
    org.springframework.web: INFO

mybatis:
  configuration:
    # 使用 SLF4J，避免 StdOutImpl 在扫描/补发时刷爆本地日志
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

attendance:
  bootstrap-default-admin: true
  default-admin-username: ${DEFAULT_ADMIN_USERNAME:admin}
  default-admin-password: ${DEFAULT_ADMIN_PASSWORD:admin123}
  allow-simulated-recognition: ${ALLOW_SIMULATED_RECOGNITION:false}
  allow-public-registration: true
