spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:attendance_assistant}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

jwt:
  secret: ${JWT_SECRET:attendance-jwt-secret-key-2024-change-in-production}
  expiration: ${JWT_EXPIRATION:604800000}

feishu:
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}

logging:
  level:
    com.attendance: DEBUG
    org.springframework.web: DEBUG

attendance:
  bootstrap-default-admin: true
  default-admin-username: admin
  default-admin-password: admin123
