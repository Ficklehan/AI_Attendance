server:
  port: 8080
  servlet:
    context-path: /clockai/api
  # 反向代理(nginx)后按 X-Forwarded-* 解析真实协议/域名，保证导出图片链接等使用公网地址
  forward-headers-strategy: framework
  tomcat:
    connection-timeout: 60000
    keep-alive-timeout: 60000

spring:
  profiles:
    active: dev
    group:
      prod: deploy
      uat: deploy
  application:
    name: attendance-assistant
  redis:
    host: ${REDIS_HOST:}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 3000ms
  mvc:
    async:
      request-timeout: 3600000
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.attendance.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:28800000}

upload:
  path: ./uploads
  max-size: 10485760

export:
  path: ./exports
  retention-days: 7
  # Excel 中考勤原图超链接的公网/API 根地址（含 context-path），生产请设 EXPORT_PUBLIC_BASE_URL
  public-base-url: ${EXPORT_PUBLIC_BASE_URL:http://localhost:8080/clockai/api}

feishu:
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}
  encryption-key: ${FEISHU_ENCRYPT_KEY:}
  verification-token: ${FEISHU_VERIFICATION_TOKEN:}
  redirect-uri: ${FEISHU_REDIRECT_URI:http://localhost:8080/clockai/api/feishu-auth/callback}
  frontend-callback-url: ${FEISHU_FRONTEND_CALLBACK_URL:http://localhost:5175/clockai/feishu/callback}
  frontend-login-url: ${FEISHU_FRONTEND_LOGIN_URL:http://localhost:5175/clockai/}
  bitable:
    app-token: ${BITABLE_APP_TOKEN:}
    table-id: ${BITABLE_TABLE_ID:}

attendance:
  upload:
    pdf-max-pages: 30
    pdf-render-dpi: 300
  recognition:
    max-per-user: ${RECOGNITION_MAX_PER_USER:2}
    global-max-concurrent: ${RECOGNITION_GLOBAL_MAX:8}
    mimo-qps: ${RECOGNITION_MIMO_QPS:5}
    zombie-timeout-minutes: ${RECOGNITION_ZOMBIE_MINUTES:36}
    upload-grace-minutes: 5
    stale-heartbeat-seconds: 120
    recovery-batch-size: 20
    queue:
      enabled: true
      max-pending: 2000
      worker-threads: 2
      poll-interval-ms: 500
      slot-wait-timeout-ms: 300000
    executor:
      core-pool-size: ${RECOGNITION_EXECUTOR_CORE:4}
      max-pool-size: ${RECOGNITION_EXECUTOR_MAX:8}
      queue-capacity: 100
    distributed:
      task-lock-seconds: 900
      leader-lock-seconds: 55
      semaphore-ttl-seconds: 3600
    pipeline: ${RECOGNITION_PIPELINE:ocr_primary}
    ocr:
      enabled: true
      engine: dsh-ocr-local
      plugin-root: ${DSH_OCR_PLUGIN_ROOT:}
      python-path: ${DSH_OCR_PYTHON:}
      model-dir: ${DSH_OCR_MODELS:}
      timeout-ms: 8000
      parallelism: ${RECOGNITION_OCR_PARALLELISM:8}
      fallback-legacy-on-unavailable: ${RECOGNITION_OCR_FALLBACK_LEGACY:true}
    harness:
      enabled: true
      profile: attendance
      crop-plugin: dsh-crop-zoom
      ground-plugin: dsh-vision-router
      crop-zoom-bin: ${DSH_CROP_ZOOM_BIN:}
      dsh-bin: ${DSH_BIN:}
      extract-timeout-ms: ${RECOGNITION_HARNESS_TIMEOUT_MS:600000}
      zoom-target: 800
      zoom-max-scale: 16
      zoom-mode: nearest
      preview-width: 1000
      pad-px: 2
      prefer-cli: ${RECOGNITION_CROP_PREFER_CLI:true}
      max-vlm-cells-per-page: 24
      vlm-parallelism: ${RECOGNITION_VLM_PARALLELISM:8}
      ground-timeout-ms: 90000
      vlm-timeout-ms: 45000
    rule:
      accept-threshold: 0.85
      review-threshold: 0.50
      ignore-long-line: true
      ink-dark-ratio: 0.028
      ink-variance: 280
      line-angle-min: 20
      line-angle-max: 75
      blur-keep-text: true
      dark-luminance: 165
  performance:
    slow-sql-ms: 500
    slow-api-ms: 800
  storage:
    type: local
    local-path: ./uploads
    oss-endpoint: ${OSS_ENDPOINT:}
    oss-bucket: ${OSS_BUCKET:}
    oss-access-key-id: ${OSS_ACCESS_KEY_ID:}
    oss-access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    oss-key-prefix: ${OSS_KEY_PREFIX:}
    oss-public-base-url: ${OSS_PUBLIC_BASE_URL:}
  cors:
    allowed-origin-patterns:
      - "*"
    allow-credentials: true
  prompt:
    # 内置标准模板版本；升级表头/字段后递增。缺 DATE_RAW 的国家（含用户改过的）会强制刷新，以便配置页看到最新正文
    seed-version: 26
    seed-on-startup: true
    # 设为 true 时每次启动强制覆盖全部国家提示词（等同重新初始化）
    force-seed-on-startup: false
    import-markdown-when-empty: true

mimo:
  api-key: ${MIMO_API_KEY:}
  api-keys: ${MIMO_API_KEYS:}
  api-url: ${MIMO_API_URL:https://api.xiaomimimo.com/v1}
  # 识图须用 mimo-v2.5 或 mimo-v2-omni；mimo-v2.5-pro 不支持 image_url
  model: ${MIMO_MODEL:mimo-v2.5}
  # OCR 用 0，减少同一张图抖动
  temperature: ${MIMO_TEMPERATURE:0}
  max-tokens: ${MIMO_MAX_TOKENS:8192}
  top-p: ${MIMO_TOP_P:0.9}

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  api-keys: ${DEEPSEEK_API_KEYS:}
  api-url: ${DEEPSEEK_API_URL:https://api.deepseek.com/v1}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash-vision-exp}
  # OCR 用 0，减少同一张图抖动
  temperature: ${DEEPSEEK_TEMPERATURE:0}
  max-tokens: ${DEEPSEEK_MAX_TOKENS:8192}
  top-p: ${DEEPSEEK_TOP_P:0.9}

logging:
  level:
    com.attendance: DEBUG
    org.springframework: INFO
  file:
    name: ./logs/attendance-assistant.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 10
      total-size-cap: 100MB
