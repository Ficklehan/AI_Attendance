server:
  port: 3000
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  application:
    name: attendance-assistant
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.attendance.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: attendance-jwt-secret-key-2024-change-in-production
  expiration: 604800000

upload:
  path: ./uploads
  max-size: 10485760

feishu:
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}
  encryption-key: ${FEISHU_ENCRYPT_KEY:}
  verification-token: ${FEISHU_VERIFICATION_TOKEN:}
  redirect-uri: ${FEISHU_REDIRECT_URI:http://localhost:3000/api/feishu-auth/callback}
  bitable:
    app-token: ${BITABLE_APP_TOKEN:}
    table-id: ${BITABLE_TABLE_ID:}

mimo:
  api-key: ${MIMO_API_KEY:}
  api-url: ${MIMO_API_URL:https://api.xiaomimimo.com/v1}

logging:
  level:
    com.attendance: DEBUG
    org.springframework: INFO
  file:
    name: ./logs/attendance-assistant.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 10
      total-size-cap: 100MB
