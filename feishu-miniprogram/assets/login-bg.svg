<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1400" viewBox="0 0 800 1400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6CF7" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#8B9AFF" stop-opacity="0.90"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="20%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <rect width="800" height="1400" fill="url(#bg)"/>
  <rect width="800" height="1400" fill="url(#glow)"/>

  <!-- soft blobs -->
  <g filter="url(#soft)" opacity="0.45">
    <circle cx="140" cy="260" r="170" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="640" cy="420" r="210" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="460" cy="980" r="260" fill="#ffffff" fill-opacity="0.10"/>
  </g>

  <!-- diagonal accents -->
  <g opacity="0.18" stroke="#ffffff" stroke-width="3" fill="none">
    <path d="M-60 240 L260 -80"/>
    <path d="M0 380 L380 20"/>
    <path d="M-30 620 L410 200"/>
    <path d="M-10 860 L420 470"/>
    <path d="M40 1080 L540 650"/>
    <path d="M230 1290 L720 820"/>
  </g>

  <!-- subtle rounded blocks -->
  <g opacity="0.12" fill="#ffffff">
    <rect x="70" y="150" width="150" height="90" rx="22"/>
    <rect x="600" y="170" width="130" height="80" rx="20"/>
    <rect x="120" y="720" width="180" height="110" rx="26"/>
    <rect x="520" y="740" width="160" height="100" rx="24"/>
    <rect x="260" y="1110" width="200" height="120" rx="30"/>
  </g>
</svg>

